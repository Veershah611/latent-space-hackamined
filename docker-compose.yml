services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solarsight-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/models:/app/models
      - ./backend/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: solarsight-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
